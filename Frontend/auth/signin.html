<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Mitra | Sign In</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
</head>
<body>
    <div class="auth-container">
        <h1>Welcome to Agri Mitra</h1>
        <p>Please sign in to continue.</p>
        <form id="auth-form">
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="sign-in-btn">Sign In</button>
            <button type="button" id="sign-up-btn">Create Account</button>
         </form>
        <div id="auth-message" class="message"></div>
        <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
    <script type="module" src ="auth.js">
    </script>
</body>
</html>
