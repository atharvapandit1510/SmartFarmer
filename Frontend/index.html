<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri Mitra</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"></script>
</head>
<body>
    <div class="user-status-bar">
        <span id="user-info">You are not logged in.</span>
        <button id="sign-out-btn" style="display:none;">Sign Out</button>
    </div>

    <h1>Agri Mitra: Your Intelligent Crop Advisor</h1>

    <div id="app-content" style="display:none;">
        <h2>Get Your Crop Recommendation</h2>
        <p>Please enter your soil and weather data below to get a crop recommendation.</p>

        <form id="crop-form">
            <label for="soil">Soil Type:</label>
            <select id="soil" name="soil_type" required>
                <option value="">Select...</option>
                <option value="clay">Clay</option>
                <option value="loamy">Loamy</option>
                <option value="sandy">Sandy</option>
            </select>
            <br>
            <label for="ph">pH Level:</label>
            <input type="number" step="0.1" id="ph" name="ph" required>
            <br>
            <label for="nitrogen">Nitrogen (N) Content:</label>
            <input type="number" step="0.1" id="nitrogen" name="nitrogen" required>
            <br>
            <label for="phosphorus">Phosphorus (P) Content:</label>
            <input type="number" step="0.1" id="phosphorus" name="phosphorus" required>
            <br>
            <label for="potassium">Potassium (K) Content:</label>
            <input type="number" step="0.1" id="potassium" name="potassium" required>
            <br>
            <label for="rainfall">Rainfall (mm/year):</label>
            <input type="number" step="0.1" id="rainfall" name="rainfall" required>
            <br>
            <label for="temperature">Temperature ($^oC$):</label>
            <input type="number" step="0.1" id="temperature" name="temperature" required>
            <br>
            <button type="submit">Recommend Crop</button>
        </form>
        <div id="recommendation-result"></div>

        <div class="schemes-section">
            <h2>Active Government Schemes</h2>
            <p>Here are some active government schemes in your region.</p>
            <input type="text" id="state-input" placeholder="Enter your State (e.g., Punjab)" required>
            <button id="get-schemes-btn">Get Schemes</button>
            <div id="schemes-list"></div>
        </div>
    </div>
    
    <script src="js/script.js"></script>
</body>
</html>
